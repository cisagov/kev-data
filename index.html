<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KEV Updates – JSON & CSV (Unified)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon: professional shield icon (data URI). Replace with official asset anytime. -->
  <link rel="icon" type="image/svg+xml"
        href='data:image/svg+xml;utf8,
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="%230b5cad"/>
              <stop offset="1" stop-color="%232d7bd1"/>
            </linearGradient>
          </defs>
          <path fill="url(%23g)" d="M32 2l22 8v16c0 16-12 29-22 36-10-7-22-20-22-36V10l22-8z"/>
          <path fill="white" d="M32 14l10 4v8c0 9-6 16-10 19-4-3-10-10-10-19v-8l10-4z"/>
          <circle cx="32" cy="26" r="6" fill="%230b5cad"/>
        </svg>' />

  <!-- =========================== -->
  <!--            CSS              -->
  <!-- =========================== -->
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1c2733;
      --muted: #5f6d7a;
      --accent: #0b5cad;
      --border: #d9dee3;
      --row: #f7f9fb;

      --chip-bg: #eef3f9;
      --added: #0f7b28;
      --removed: #b00020;
      --ransom: #8a2be2;
      --admin: #8a6d1c;
      --csv: #0b5cad;
      --json: #2d7bd1;
    }
    body.dark {
      --bg: #0f141a;
      --fg: #e8eef3;
      --muted: #a0adb7;
      --accent: #58a6ff;
      --border: #2a3742;
      --row: #111821;
      --chip-bg: #0f253d;
      --csv: #58a6ff;
      --json: #8dbbff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    header {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center;
      gap: 16px; padding: 24px clamp(16px, 5vw, 48px);
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(11,92,173,0.07), transparent);
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
    }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 8px; background: var(--row);
      display: grid; place-items: center; border: 1px solid var(--border);
    }
    .brand-icon svg { width: 24px; height: 24px; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); }
    .sub { color: var(--muted); font-size: 14px; }
    .controls { display: flex; gap: 10px; align-items: center; }
    .btn {
      background: var(--row); color: var(--fg);
      border: 1px solid var(--border); padding: 8px 12px;
      border-radius: 8px; cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }

    main { padding: 32px clamp(16px, 5vw, 48px); display: grid; gap: 28px; }

    section {
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg);
    }
    .section-header {
      background: var(--row); padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .updated { color: var(--muted); font-size: 13px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border);
      color: var(--muted); white-space: nowrap;
    }
    tbody td {
      padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top;
    }
    tbody tr:nth-child(even) { background: var(--row); }

    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .chip {
      display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px;
      background: var(--chip-bg); border: 1px solid var(--border); margin-right: 6px;
    }
    .chip.csv { color: var(--csv); border-color: var(--csv); }
    .chip.json { color: var(--json); border-color: var(--json); }
    .chip.added { color: var(--added); border-color: var(--added); }
    .chip.removed { color: var(--removed); border-color: var(--removed); }
    .chip.ransom { color: var(--ransom); border-color: var(--ransom); }
    .chip.admin { color: var(--admin); border-color: var(--admin); }

    details { margin-top: 8px; border-left: 3px solid var(--border); padding-left: 12px; }
    summary { cursor: pointer; color: var(--accent); }
    ul { margin: 8px 0 0 20px; }
    footer {
      padding: 24px clamp(16px, 5vw, 48px); color: var(--muted); border-top: 1px solid var(--border);
    }
    @media (max-width: 720px) { header { grid-template-columns: 1fr auto; } }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <!-- Header icon (same shield) -->
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img">
          <defs>
            <linearGradient id="gh" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0b5cad"/><stop offset="1" stop-color="#2d7bd1"/>
            </linearGradient>
          </defs>
          <path fill="url(#gh)" d="M32 2l22 8v16c0 16-12 29-22 36-10-7-22-20-22-36V10l22-8z"/>
          <path fill="white" d="M32 14l10 4v8c0 9-6 16-10 19-4-3-10-10-10-19v-8l10-4z"/>
          <circle cx="32" cy="26" r="6" fill="#0b5cad"/>
        </svg>
      </div>
      <div>
        <h1>KEV Updates (Unified)</h1>
        <div class="sub">Latest 5 updates affecting JSON/CSV, with CVE diffs, ransomware tagging, and administrative changes.</div>
      </div>
    </div>
    <div class="controls">
      <button id="themeToggle" class="btn" aria-label="Toggle theme">🌙 / 🌞</button>
      <button id="refresh" class="btn" aria-label="Refresh data">⟳ Refresh</button>
    </div>
  </header>

  <main>
    <section>
      <div class="section-header">
        <div>
          <strong>Unified Timeline</strong>
          <div id="updated" class="updated"></div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Commit Time</th>
              <th>Files Changed</th>
              <th>Summary</th>
              <th>Details (per CVE)</th>
            </tr>
          </thead>
          <tbody id="timeline">
            <tr><td colspan="4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    Data loads live from GitHub on each view. No manual updates required.
  </footer>

  <!-- =========================== -->
  <!--          JAVASCRIPT         -->
  <!-- =========================== -->
  <script>
    const OWNER = "cisagov";
    const REPO  = "kev-data";

    const PATHS = {
      JSON: "known_exploited_vulnerabilities.json",
      CSV:  "known_exploited_vulnerabilities.csv"
    };

    /* ===== Theme ===== */
    const themeBtn = document.getElementById("themeToggle");
    const saved = localStorage.getItem("theme") || "light";
    if (saved === "dark") document.body.classList.add("dark");
    themeBtn.onclick = () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    };
    document.getElementById("refresh").onclick = () => loadUnified();

    const fmt = d => new Date(d).toLocaleString(undefined, { hour12: false });

    /* ===== GitHub API Helpers ===== */
    async function fetchJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${r.status} ${url}`);
      return r.json();
    }
    async function fetchText(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${r.status} ${url}`);
      return r.text();
    }

    async function listRecentCommits(perPage=30) {
      return fetchJSON(`https://api.github.com/repos/${OWNER}/${REPO}/commits?per_page=${perPage}`);
    }
    async function getCommitDetails(sha) {
      return fetchJSON(`https://api.github.com/repos/${OWNER}/${REPO}/commits/${sha}`);
    }
    async function rawAt(sha, path) {
      return fetchText(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${sha}/${path}`);
    }
    async function listHistoryForPath(path, perPage=50) {
      return fetchJSON(`https://api.github.com/repos/${OWNER}/${REPO}/commits?path=${encodeURIComponent(path)}&per_page=${perPage}`);
    }

    /* ===== Parsing & Normalization ===== */
    // Normalize values to avoid false positives (e.g., whitespace, null vs empty, key order).
    function normalizeValue(val) {
      if (val === undefined || val === null) return null;
      if (typeof val === "string") {
        const s = val.trim();
        return s.length ? s.replace(/\s+/g, " ") : null; // treat empty as null
      }
      if (typeof val === "number" || typeof val === "boolean") return val;
      if (Array.isArray(val)) {
        const norm = val.map(v => normalizeValue(v)).filter(v => v !== null);
        return norm.sort((a,b)=>String(a).localeCompare(String(b)));
      }
      if (typeof val === "object") {
        const keys = Object.keys(val).sort();
        const obj = {};
        for (const k of keys) obj[k] = normalizeValue(val[k]);
        return obj; // compare by JSON.stringify of normalized object
      }
      return val;
    }
    function eq(a,b) { return JSON.stringify(normalizeValue(a)) === JSON.stringify(normalizeValue(b)); }

    // JSON parser
    function parseKEVJson(text) {
      const data = JSON.parse(text);
      const rows = Array.isArray(data) ? data : (Array.isArray(data.vulnerabilities) ? data.vulnerabilities : []);
      const map = new Map();
      for (const row of rows) {
        const id = row.cveID || row.cveId || row.cve || row.CVE;
        if (!id) continue;
        map.set(String(id), row);
      }
      return map;
    }

    // Robust CSV parser (handles quotes/commas)
    function parseCsv(text) {
      const out = [];
      let i=0, field="", row=[], inQ=false;
      while (i<text.length) {
        const c=text[i++];
        if (inQ) {
          if (c===`"`) {
            if (text[i]===`"`) { field+=`"`; i++; } else { inQ=false; }
          } else field+=c;
        } else {
          if (c===`,`) { row.push(field); field=""; }
          else if (c===`\n`) { row.push(field); field=""; out.push(row); row=[]; }
          else if (c===`\r`) { /* ignore */ }
          else if (c===`"`) inQ=true;
          else field+=c;
        }
      }
      if (field.length || row.length) { row.push(field); out.push(row); }
      const header = (out.shift() || []).map(h => h.trim());
      const idx = Object.fromEntries(header.map((h, i)=>[h, i]));
      const arr = out.filter(r => r.length>0 && r.some(x=>x?.trim()?.length)).map(r=>{
        const obj={}; header.forEach((h,j)=>obj[h]= (r[j]||"").trim()); return obj;
      });
      const idCol = ["cveID","cveId","cve","CVE","CVE_ID","cve_id"].find(k => k in idx) || "cveID";
      const map = new Map();
      for (const row of arr) {
        const id = row[idCol];
        if (id) map.set(String(id), row);
      }
      return map;
    }

    /* ===== Diffing (per file) ===== */
    function diffRecords(currMap, prevMap, isJson=false) {
      const changes = new Map(); // id -> array of change entries

      const ids = new Set([...currMap.keys(), ...prevMap.keys()]);
      for (const id of ids) {
        const c = currMap.get(id), p = prevMap.get(id);

        if (c && !p) {
          changes.set(id, [{type:"added"}]);
          continue;
        }
        if (!c && p) {
          changes.set(id, [{type:"removed"}]);
          continue;
        }
        if (c && p) {
          const entries = [];

          // Special case: ransomware tag (Option A)
          const currRan = isJson ? Boolean(c.knownRansomwareCampaignUse) : null;
          const prevRan = isJson ? Boolean(p.knownRansomwareCampaignUse) : null;
          if (isJson && currRan !== prevRan) {
            entries.push({ type:"ransom", field:"knownRansomwareCampaignUse", from: prevRan, to: currRan });
          }

          // Administrative changes: any other field change
          const keys = new Set([...Object.keys(c), ...Object.keys(p)]);
          for (const key of keys) {
            if (key === "cveID" || key === "cveId" || key === "cve" || key === "CVE" || key === "knownRansomwareCampaignUse") continue;

            const fromV = p ? p[key] : null;
            const toV   = c ? c[key] : null;

            if (!eq(fromV, toV)) {
              entries.push({
                type: "admin",
                field: key,
                from: displayVal(fromV),
                to:   displayVal(toV)
              });
            }
          }

          if (entries.length) changes.set(id, entries);
        }
      }
      return changes; // Map id -> [changes...]
    }

    function displayVal(v) {
      if (v === null || v === undefined || (typeof v === "string" && v.trim()==="")) return "(empty)";
      if (typeof v === "boolean") return v ? "true" : "false";
      if (Array.isArray(v)) return v.length ? JSON.stringify(v) : "(empty)";
      if (typeof v === "object") return JSON.stringify(v);
      return String(v);
    }

    /* ===== Rendering ===== */
    function chipsForFiles(flags) {
      const arr = [];
      if (flags.json) arr.push(`<span class="chip json">JSON</span>`);
      if (flags.csv)  arr.push(`<span class="chip csv">CSV</span>`);
      return arr.join(" ");
    }

    function summaryChips(changeMap) {
      // Determine which types occurred in this commit
      const types = new Set();
      for (const arr of changeMap.values()) {
        for (const ch of arr) {
          if (ch.type==="added") types.add("added");
          else if (ch.type==="removed") types.add("removed");
          else if (ch.type==="ransom") types.add("ransom");
          else if (ch.type==="admin") types.add("admin");
        }
      }
      const out = [];
      if (types.has("added"))  out.push(`<span class="chip added">added</span>`);
      if (types.has("removed")) out.push(`<span class="chip removed">removed</span>`);
      if (types.has("ransom")) out.push(`<span class="chip ransom">ransomware changed</span>`);
      if (types.has("admin"))  out.push(`<span class="chip admin">admin changed</span>`);
      return out.join(" ");
    }

    function detailsList(changeMap) {
      // Show per-CVE details, listing only what actually happened
      const items = [];
      const ids = Array.from(changeMap.keys()).sort((a,b)=>String(a).localeCompare(String(b)));
      for (const id of ids) {
        const changes = changeMap.get(id);
        for (const ch of changes) {
          if (ch.type === "added") {
            items.push(`<li class="mono">${id} — added</li>`);
          } else if (ch.type === "removed") {
            items.push(`<li class="mono">${id} — removed</li>`);
          } else if (ch.type === "ransom") {
            items.push(`<li class="mono">${id} — ransomware tag changed (${displayVal(ch.from)} → ${displayVal(ch.to)})</li>`);
          } else if (ch.type === "admin") {
            items.push(`<li class="mono">${id} — admin change: ${ch.field} (${ch.from} → ${ch.to})</li>`);
          }
        }
      }
      if (!items.length) return "No CVE-level changes.";
      return `<details><summary>View CVE details</summary><ul>${items.join("")}</ul></details>`;
    }

    function renderRow(commitTime, fileFlags, combinedChanges) {
      return `<tr>
        <td class="mono">${fmt(commitTime)}</td>
        <td>${chipsForFiles(fileFlags)}</td>
        <td>${summaryChips(combinedChanges) || "No changes"}</td>
        <td>${detailsList(combinedChanges)}</td>
      </tr>`;
    }

    /* ===== Unified Loader ===== */
    async function loadUnified() {
      const tbody = document.getElementById("timeline");
      const updated = document.getElementById("updated");
      try {
        // 1) Get recent commits and inspect which touched JSON or CSV
        const recent = await listRecentCommits(40); // fetch enough to find 5 relevant commits
        const commitsWithFiles = [];
        for (const c of recent) {
          const details = await getCommitDetails(c.sha);
          const changedPaths = (details.files || []).map(f => f.filename);
          const touchedJson = changedPaths.includes(PATHS.JSON);
          const touchedCsv  = changedPaths.includes(PATHS.CSV);
          if (touchedJson || touchedCsv) {
            commitsWithFiles.push({ base: c, touchedJson, touchedCsv });
          }
          if (commitsWithFiles.length >= 10) break; // keep a buffer
        }

        // Filter commits touching JSON or CSV within the last 14 days
        const days14 = 14 * 24 * 60 * 60 * 1000;
        const cutoff = Date.now() - days14;

        const relevant = commitsWithFiles.filter(item => {
        const ct = new Date(item.base.commit?.author?.date || item.base.commit?.committer?.date).getTime();
        return ct >= cutoff;
        });        

        // 2) Build lookup arrays for file histories to find "previous" commit per file
        const jsonHist = await listHistoryForPath(PATHS.JSON, 60);
        const csvHist  = await listHistoryForPath(PATHS.CSV, 60);

        // 3) For each relevant commit, compute per-file diffs, then merge
        const rows = [];
        for (const item of relevant) {
          const sha = item.base.sha;
          const commitTime = item.base.commit?.author?.date || item.base.commit?.committer?.date;

          let combined = new Map();            // id -> [changes...] from both files
          const fileFlags = { json: false, csv: false };

          // JSON diff
          if (item.touchedJson) {
            fileFlags.json = true;
            const currText = await rawAt(sha, PATHS.JSON);
            const prevSha  = findPrevSha(jsonHist, sha);
            const prevText = prevSha ? await rawAt(prevSha, PATHS.JSON) : null;

            const currMap = parseKEVJson(currText);
            const prevMap = prevText ? parseKEVJson(prevText) : new Map();

            const diffMap = diffRecords(currMap, prevMap, true);
            combined = mergeChangeMaps(combined, diffMap);
          }

          // CSV diff
          if (item.touchedCsv) {
            fileFlags.csv = true;
            const currText = await rawAt(sha, PATHS.CSV);
            const prevSha  = findPrevSha(csvHist, sha);
            const prevText = prevSha ? await rawAt(prevSha, PATHS.CSV) : null;

            const currMap = parseCsv(currText);
            const prevMap = prevText ? parseCsv(prevText) : new Map();

            const diffMap = diffRecords(currMap, prevMap, false); // ransomware only for JSON
            combined = mergeChangeMaps(combined, diffMap);
          }

          rows.push(renderRow(commitTime, fileFlags, combined));
        }

        tbody.innerHTML = rows.join("") || `<tr><td colspan="4">No recent JSON/CSV updates found.</td></tr>`;
        updated.textContent = "Last updated: " + fmt(new Date());
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="4">Error loading updates: ${e.message}</td></tr>`;
      }
    }

    function findPrevSha(historyList, currentSha) {
      const idx = historyList.findIndex(c => c.sha === currentSha);
      const prev = idx >= 0 ? historyList[idx+1] : null;
      return prev ? prev.sha : null;
    }

    function mergeChangeMaps(baseMap, newMap) {
      const merged = new Map(baseMap);
      for (const [id, list] of newMap.entries()) {
        if (!merged.has(id)) merged.set(id, list);
        else merged.set(id, merged.get(id).concat(list));
      }
      return merged;
    }

    // Initial load
    loadUnified();
  </script>
</body>
</html>
