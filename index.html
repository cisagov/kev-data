<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KEV Data – Latest JSON & CSV Updates</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- =========================== -->
  <!--         PROFESSIONAL CSS    -->
  <!-- =========================== -->
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1c2733;
      --muted: #5f6d7a;
      --accent: #0b5cad;
      --border: #d9dee3;
      --row: #f7f9fb;

      --added: #0f7b28;
      --removed: #b00020;
      --ransom: #8a2be2;
      --admin: #8a6d1c;

      --chip-bg: #eef3f9;
    }

    body.dark {
      --bg: #0f141a;
      --fg: #e8eef3;
      --muted: #a0adb7;
      --accent: #58a6ff;
      --border: #2a3742;
      --row: #111821;
      --chip-bg: #0f253d;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    header {
      padding: 24px clamp(16px, 5vw, 48px);
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(11,92,173,0.07), transparent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: clamp(22px, 3vw, 32px);
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
    }

    .btn {
      background: var(--row);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-left: 12px;
    }
    .btn:hover {
      border-color: var(--accent);
    }

    main {
      padding: 32px clamp(16px, 5vw, 48px);
      display: grid;
      gap: 40px;
    }

    section {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg);
    }

    .section-header {
      background: var(--row);
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .section-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .updated {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: 14px;
    }

    tr:nth-child(even) {
      background: var(--row);
    }

    .mono {
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }

    .chip {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 12px;
      margin-right: 6px;
      background: var(--chip-bg);
      border: 1px solid var(--border);
    }
    .added { color: var(--added); border-color: var(--added); }
    .removed { color: var(--removed); border-color: var(--removed); }
    .ransom { color: var(--ransom); border-color: var(--ransom); }
    .admin { color: var(--admin); border-color: var(--admin); }

    details {
      margin-top: 8px;
      border-left: 3px solid var(--border);
      padding-left: 12px;
    }
    summary {
      cursor: pointer;
      font-size: 14px;
      color: var(--accent);
    }

    ul {
      margin: 6px 0 0 0;
      padding-left: 20px;
    }

    footer {
      padding: 24px clamp(16px, 5vw, 48px);
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>KEV Data – Latest JSON & CSV Updates</h1>
      <div class="sub">Always shows the newest 5 updates to known_exploited_vulnerabilities.json and .csv</div>
    </div>
    <div>
      <button id="themeToggle" class="btn">🌙 / 🌞</button>
      <button id="refresh" class="btn">⟳ Refresh</button>
    </div>
  </header>

  <main>
    <!-- JSON -->
    <section>
      <div class="section-header">
        <h2>JSON Updates</h2>
        <div id="json-updated" class="updated"></div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Commit Time</th>
            <th>Changes</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="json-body">
          <tr><td colspan="3">Loading…</td></tr>
        </tbody>
      </table>
    </section>

    <!-- CSV -->
    <section>
      <div class="section-header">
        <h2>CSV Updates</h2>
        <div id="csv-updated" class="updated"></div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Commit Time</th>
            <th>Changes</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="csv-body">
          <tr><td colspan="3">Loading…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    Data retrieved live from GitHub on each page load.
  </footer>


  <!-- =========================== -->
  <!--       JAVASCRIPT LOGIC      -->
  <!-- =========================== -->
  <script>
    const OWNER = "cisagov";
    const REPO = "kev-data";

    const FILES = {
      json: "known_exploited_vulnerabilities.json",
      csv:  "known_exploited_vulnerabilities.csv",
    };

    /* ---------- Theme ---------- */
    const themeBtn = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("theme") || "light";
    if (savedTheme === "dark") document.body.classList.add("dark");

    themeBtn.onclick = () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    };

    document.getElementById("refresh").onclick = () => loadAll();

    const fmt = d => new Date(d).toLocaleString();

    /* ---------- GitHub API Calls ---------- */
    async function commitsFor(path) {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/commits?path=${path}&per_page=10`;
      const r = await fetch(url);
      return r.json();
    }

    async function rawAt(sha, path) {
      const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${sha}/${path}`;
      const r = await fetch(url);
      return r.text();
    }

    /* ---------- Parsers ---------- */
    function parseJson(text) {
      const data = JSON.parse(text);
      const rows = Array.isArray(data) ? data : data.vulnerabilities;
      const map = new Map();
      rows.forEach(v => {
        const id = v.cveID || v.cveId || v.cve || v.CVE;
        if (id) map.set(id, v);
      });
      return map;
    }

    function parseCsv(text) {
      const rows = text.split(/\r?\n/).map(r => r.split(","));
      const header = rows.shift();
      if (!header) return new Map();

      const map = new Map();
      rows.forEach(r => {
        const obj = {};
        header.forEach((h, i) => obj[h.trim()] = (r[i] || "").trim());
        const id = obj.cveID || obj.cveId || obj.cve || obj.CVE;
        if (id) map.set(id, obj);
      });
      return map;
    }

    /* ---------- Diffing ---------- */
    function diffMaps(curr, prev) {
      const out = [];

      const keys = new Set([...curr.keys(), ...prev.keys()]);

      for (const id of keys) {
        const c = curr.get(id);
        const p = prev.get(id);

        // CVE added
        if (c && !p) {
          out.push({ id, type: "added" });
          continue;
        }

        // CVE removed
        if (!c && p) {
          out.push({ id, type: "removed" });
          continue;
        }

        // Both exist: compare fields
        if (c && p) {
          const changes = [];

          const currRansom = Boolean(c.knownRansomwareCampaignUse);
          const prevRansom = Boolean(p.knownRansomwareCampaignUse);

          if (currRansom !== prevRansom) {
            changes.push({ field: "knownRansomwareCampaignUse", from: prevRansom, to: currRansom, type: "ransom" });
          }

          // Administrative changes for any other field
          for (const key of Object.keys(c)) {
            if (key === "cveID" || key === "knownRansomwareCampaignUse") continue;

            if ((p[key] || "") !== (c[key] || "")) {
              changes.push({
                field: key,
                from: p[key] || "(empty)",
                to: c[key] || "(empty)",
                type: "admin"
              });
            }
          }

          if (changes.length) {
            out.push({ id, type: "changed", details: changes });
          }
        }
      }

      return out;
    }

    /* ---------- Renderer ---------- */
    function render(commitTime, diffs, file) {
      const chips = {
        added: `<span class="chip added">added</span>`,
        removed: `<span class="chip removed">removed</span>`,
        ransom: `<span class="chip ransom">ransomware changed</span>`,
        admin: `<span class="chip admin">admin changed</span>`,
      };

      let summaryChips = "";

      // Build summary chip line (unique change types)
      const types = new Set();
      diffs.forEach(d => {
        if (d.type === "added") types.add("added");
        if (d.type === "removed") types.add("removed");
        if (d.type === "changed") {
          d.details.forEach(ch => types.add(ch.type));
        }
      });

      types.forEach(t => summaryChips += chips[t] || "");

      // Details section
      let details = "";

      details += `<details><summary>View details</summary><ul>`;

      diffs.forEach(d => {
        if (d.type === "added") {
          details += `<li class="mono">${d.id} — added</li>`;
        } else if (d.type === "removed") {
          details += `<li class="mono">${d.id} — removed</li>`;
        } else if (d.type === "changed") {
          d.details.forEach(ch => {
            if (ch.type === "ransom") {
              details += `<li class="mono">${d.id} — ransomware tag changed (${ch.from} → ${ch.to})</li>`;
            } else {
              details += `<li class="mono">${d.id} — admin change: ${ch.field} (${ch.from} → ${ch.to})</li>`;
            }
          });
        }
      });

      details += `</ul></details>`;

      return `
        <tr>
          <td class="mono">${fmt(commitTime)}</td>
          <td>${summaryChips || "No changes"}</td>
          <td>${details}</td>
        </tr>`;
    }

    /* ---------- Loaders ---------- */
    async function loadSection(path, tbodyId, updatedId, parser) {
      const tbody = document.getElementById(tbodyId);
      const updated = document.getElementById(updatedId);

      try {
        const commits = await commitsFor(path);
        const five = commits.slice(0,5);

        const rows = [];

        for (let i = 0; i < five.length; i++) {
          const curr = five[i];
          const prev = commits[i+1];

          const currFile = await rawAt(curr.sha, path);
          const prevFile = prev ? await rawAt(prev.sha, path) : null;

          const currMap = parser(currFile);
          const prevMap = prevFile ? parser(prevFile) : new Map();

          const diffs = diffMaps(currMap, prevMap);

          rows.push(render(curr.commit.author.date, diffs, path));
        }

        tbody.innerHTML = rows.join("");
        updated.textContent = "Last updated: " + fmt(new Date());
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="3">Error: ${e.message}</td></tr>`;
      }
    }

    async function loadAll() {
      await Promise.all([
        loadSection(FILES.json, "json-body", "json-updated", parseJson),
        loadSection(FILES.csv, "csv-body", "csv-updated", parseCsv),
      ]);
    }

    loadAll();
  </script>
</body>
</html>
