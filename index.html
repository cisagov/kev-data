<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KEV Updates – Unified + Dashboard (Rate‑friendly)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon: shield-style professional icon (replace with official when available). -->
  <link rel="icon" type="image/svg+xml"
        href='data:image/svg+xml;utf8,
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="%230b5cad"/>
              <stop offset="1" stop-color="%232d7bd1"/>
            </linearGradient>
          </defs>
          <path fill="url(%23g)" d="M32 2l22 8v16c0 16-12 29-22 36-10-7-22-20-22-36V10l22-8z"/>
          <path fill="white" d="M32 14l10 4v8c0 9-6 16-10 19-4-3-10-10-10-19v-8l10-4z"/>
          <circle cx="32" cy="26" r="6" fill="%230b5cad"/>
        </svg>' />

  <style>
    :root {
      --bg: #ffffff; --fg: #1c2733; --muted: #5f6d7a; --accent: #0b5cad;
      --border: #d9dee3; --row: #f7f9fb; --chip-bg: #eef3f9;
      --added: #0f7b28; --removed: #b00020; --ransom: #8a2be2; --admin: #8a6d1c;
      --csv: #0b5cad; --json: #2d7bd1; --card-bg: #ffffff;
    }
    body.dark {
      --bg: #0f141a; --fg: #e8eef3; --muted: #a0adb7; --accent: #58a6ff;
      --border: #2a3742; --row: #111821; --chip-bg: #0f253d;
      --csv: #58a6ff; --json: #8dbbff; --card-bg: #0f141a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    header {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center;
      gap: 16px; padding: 24px clamp(16px, 5vw, 48px);
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(11,92,173,0.07), transparent);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--row);
      display: grid; place-items: center; border: 1px solid var(--border); }
    .brand-icon svg { width: 24px; height: 24px; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); }
    .sub { color: var(--muted); font-size: 14px; }
    .controls { display: flex; gap: 10px; align-items: center; }
    .btn { background: var(--row); color: var(--fg);
      border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .btn:hover { border-color: var(--accent); }

    main { padding: 24px clamp(16px, 5vw, 48px); display: grid; gap: 24px; }

    /* Dashboard cards */
    .dash { display: grid; gap: 12px; grid-template-columns: repeat(5, minmax(180px, 1fr)); }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .card h3 { margin: 0 0 8px 0; font-size: 14px; color: var(--muted); }
    .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .num { background: var(--row); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; text-align: center; font-size: 13px; }
    .num strong { font-size: 16px; display: block; }

    section { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg); }
    .section-header { background: var(--row); padding: 12px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; justify-content: space-between; }
    .updated { color: var(--muted); font-size: 13px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
    tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tbody tr:nth-child(even) { background: var(--row); }

    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .chip { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px;
      background: var(--chip-bg); border: 1px solid var(--border); margin-right: 6px; }
    .chip.csv { color: var(--csv); border-color: var(--csv); }
    .chip.json { color: var(--json); border-color: var(--json); }
    .chip.added { color: var(--added); border-color: var(--added); }
    .chip.removed { color: var(--removed); border-color: var(--removed); }
    .chip.ransom { color: var(--ransom); border-color: var(--ransom); }
    .chip.admin { color: var(--admin); border-color: var(--admin); }

    details { margin-top: 8px; border-left: 3px solid var(--border); padding-left: 12px; }
    summary { cursor: pointer; color: var(--accent); }
    ul { margin: 8px 0 0 20px; }
    footer { padding: 16px clamp(16px, 5vw, 48px); color: var(--muted); border-top: 1px solid var(--border); }

    @media (max-width: 1100px) { .dash { grid-template-columns: repeat(3, minmax(180px, 1fr)); } }
    @media (max-width: 720px) { header { grid-template-columns: 1fr auto; } .dash { grid-template-columns: repeat(2, minmax(160px, 1fr)); } }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <!-- Header icon (shield) -->
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img">
          <defs><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0b5cad"/><stop offset="1" stop-color="#2d7bd1"/></linearGradient></defs>
          <path fill="url(#gh)" d="M32 2l22 8v16c0 16-12 29-22 36-10-7-22-20-22-36V10l22-8z"/>
          <path fill="white" d="M32 14l10 4v8c0 9-6 16-10 19-4-3-10-10-10-19v-8l10-4z"/>
          <circle cx="32" cy="26" r="6" fill="#0b5cad"/>
        </svg>
      </div>
      <div>
        <h1>KEV Updates (Unified)</h1>
        <div class="sub">Dashboard + unified timeline (JSON/CSV), CVE diffs, ransomware tag changes, admin field diffs.</div>
      </div>
    </div>
    <div class="controls">
      <button id="themeToggle" class="btn" aria-label="Toggle theme">🌙 / 🌞</button>
      <button id="refresh" class="btn" aria-label="Refresh data">⟳ Refresh</button>
    </div>
  </header>

  <!-- DASHBOARD -->
  <main>
    <section>
      <div class="section-header">
        <div><strong>Dashboard</strong><div id="dash-updated" class="updated"></div></div>
      </div>
      <div class="dash" id="dashboard"></div>
    </section>

    <!-- UNIFIED TIMELINE -->
    <section>
      <div class="section-header">
        <div><strong>Unified Timeline (last 14 days)</strong><div id="updated" class="updated"></div></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
          <tr><th>Commit Time</th><th>Files Changed</th><th>Summary</th><th>Details (per CVE)</th></tr>
          </thead>
          <tbody id="timeline"><tr><td colspan="4">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>Data loads live from GitHub on each view.</footer>

  <script>
    const OWNER = "cisagov";
    const REPO  = "kev-data";
    const PATHS = {
      JSON: "known_exploited_vulnerabilities.json",
      CSV:  "known_exploited_vulnerabilities.csv"
    };

    /* ===== Theme ===== */
    const themeBtn = document.getElementById("themeToggle");
    const saved = localStorage.getItem("theme") || "light";
    if (saved === "dark") document.body.classList.add("dark");
    themeBtn.onclick = () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    };
    document.getElementById("refresh").onclick = () => loadUnified();

    const fmt = d => new Date(d).toLocaleString(undefined, { hour12: false });

    /* ===== GitHub API Helpers (rate‑friendly) ===== */
    async function fetchJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${r.status} ${url}`);
      return r.json();
    }
    async function fetchText(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${r.status} ${url}`);
      return r.text();
    }

    // File‑specific histories only (avoids GET /commits/{sha})
    async function listHistoryForPath(path, perPage=120) {
      return fetchJSON(`https://api.github.com/repos/${OWNER}/${REPO}/commits?path=${encodeURIComponent(path)}&per_page=${perPage}`);
    }
    async function rawAt(sha, path) {
      return fetchText(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${sha}/${path}`);
    }

    /* ===== Parsing & Normalization ===== */
    function normalizeValue(val) {
      if (val === undefined || val === null) return null;
      if (typeof val === "string") {
        const s = val.trim();
        return s.length ? s.replace(/\s+/g, " ") : null;
      }
      if (typeof val === "number" || typeof val === "boolean") return val;
      if (Array.isArray(val)) {
        const norm = val.map(v => normalizeValue(v)).filter(v => v !== null);
        return norm.sort((a,b)=>String(a).localeCompare(String(b)));
      }
      if (typeof val === "object") {
        const keys = Object.keys(val).sort();
        const obj = {};
        for (const k of keys) obj[k] = normalizeValue(val[k]);
        return obj;
      }
      return val;
    }
    function eq(a,b) { return JSON.stringify(normalizeValue(a)) === JSON.stringify(normalizeValue(b)); }

    function parseKEVJson(text) {
      const data = JSON.parse(text);
      const rows = Array.isArray(data) ? data : (Array.isArray(data.vulnerabilities) ? data.vulnerabilities : []);
      const map = new Map();
      for (const row of rows) {
        const id = row.cveID || row.cveId || row.cve || row.CVE;
        if (!id) continue;
        map.set(String(id), row);
      }
      return map;
    }

    // Robust CSV parser (quotes/commas/CRLF)
    function parseCsv(text) {
      const out = [];
      let i=0, field="", row=[], inQ=false;
      while (i<text.length) {
        const c=text[i++];
        if (inQ) {
          if (c===`"`) {
            if (text[i]===`"`) { field+=`"`; i++; } else { inQ=false; }
          } else field+=c;
        } else {
          if (c===`,`) { row.push(field); field=""; }
          else if (c===`\n`) { row.push(field); field=""; out.push(row); row=[]; }
          else if (c===`\r`) { /* ignore */ }
          else if (c===`"`) inQ=true;
          else field+=c;
        }
      }
      if (field.length || row.length) { row.push(field); out.push(row); }
      const header = (out.shift() || []).map(h => h.trim());
      const idx = Object.fromEntries(header.map((h, i)=>[h, i]));
      const arr = out.filter(r => r.length>0 && r.some(x=>x?.trim()?.length)).map(r=>{
        const obj={}; header.forEach((h,j)=>obj[h]= (r[j]||"").trim()); return obj;
      });
      const idCol = ["cveID","cveId","cve","CVE","CVE_ID","cve_id"].find(k => k in idx) || "cveID";
      const map = new Map();
      for (const row of arr) {
        const id = row[idCol];
        if (id) map.set(String(id), row);
      }
      return map;
    }

    /* ===== Diffing ===== */
    function diffRecords(currMap, prevMap, isJson=false) {
      const changes = new Map(); // id -> [changes...]

      const ids = new Set([...currMap.keys(), ...prevMap.keys()]);
      for (const id of ids) {
        const c = currMap.get(id), p = prevMap.get(id);

        if (c && !p) { changes.set(id, [{type:"added"}]); continue; }
        if (!c && p) { changes.set(id, [{type:"removed"}]); continue; }

        if (c && p) {
          const entries = [];

          // Ransomware tag (Option A: boolean)
          const currRan = isJson ? Boolean(c.knownRansomwareCampaignUse) : null;
          const prevRan = isJson ? Boolean(p.knownRansomwareCampaignUse) : null;
          if (isJson && currRan !== prevRan) {
            entries.push({ type:"ransom", field:"knownRansomwareCampaignUse", from: prevRan, to: currRan });
          }

          // Administrative changes: any other changed field
          const keys = new Set([...Object.keys(c), ...Object.keys(p)]);
          for (const key of keys) {
            if (key === "cveID" || key === "cveId" || key === "cve" || key === "CVE" || key === "knownRansomwareCampaignUse") continue;

            const fromV = p ? p[key] : null;
            const toV   = c ? c[key] : null;

            if (!eq(fromV, toV)) {
              entries.push({ type:"admin", field: key, from: displayVal(fromV), to: displayVal(toV) });
            }
          }

          if (entries.length) changes.set(id, entries);
        }
      }
      return changes;
    }

    function displayVal(v) {
      if (v === null || v === undefined || (typeof v === "string" && v.trim()==="")) return "(empty)";
      if (typeof v === "boolean") return v ? "true" : "false";
      if (Array.isArray(v)) return v.length ? JSON.stringify(v) : "(empty)";
      if (typeof v === "object") return JSON.stringify(v);
      return String(v);
    }

    /* ===== Rendering ===== */
    function chipsForFiles(flags) {
      const arr = [];
      if (flags.json) arr.push(`<span class="chip json">JSON</span>`);
      if (flags.csv)  arr.push(`<span class="chip csv">CSV</span>`);
      return arr.join(" ");
    }
    function summaryChips(changeMap) {
      const types = new Set();
      for (const arr of changeMap.values()) for (const ch of arr) types.add(ch.type);
      const out = [];
      if (types.has("added"))  out.push(`<span class="chip added">added</span>`);
      if (types.has("removed")) out.push(`<span class="chip removed">removed</span>`);
      if (types.has("ransom")) out.push(`<span class="chip ransom">ransomware changed</span>`);
      if (types.has("admin"))  out.push(`<span class="chip admin">admin changed</span>`);
      return out.join(" ");
    }
    function detailsList(changeMap) {
      const items = [];
      const ids = Array.from(changeMap.keys()).sort((a,b)=>String(a).localeCompare(String(b)));
      for (const id of ids) {
        const changes = changeMap.get(id);
        for (const ch of changes) {
          if (ch.type === "added") items.push(`<li class="mono">${id} — added</li>`);
          else if (ch.type === "removed") items.push(`<li class="mono">${id} — removed</li>`);
          else if (ch.type === "ransom") items.push(`<li class="mono">${id} — ransomware tag changed (${displayVal(ch.from)} → ${displayVal(ch.to)})</li>`);
          else if (ch.type === "admin") items.push(`<li class="mono">${id} — admin change: ${ch.field} (${ch.from} → ${ch.to})</li>`);
        }
      }
      if (!items.length) return "No CVE-level changes.";
      return `<details><summary>View CVE details</summary><ul>${items.join("")}</ul></details>`;
    }
    function renderRow(commitTime, fileFlags, combinedChanges) {
      return `<tr>
        <td class="mono">${fmt(commitTime)}</td>
        <td>${chipsForFiles(fileFlags)}</td>
        <td>${summaryChips(combinedChanges) || "No changes"}</td>
        <td>${detailsList(combinedChanges)}</td>
      </tr>`;
    }

    /* ===== Dashboard Aggregation ===== */
    function startOfToday(d = new Date()) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
    function startOfWeek(d = new Date()) { const x = new Date(); x.setHours(0,0,0,0); x.setDate(x.getDate() - 6); return x; } // last 7 days
    function startOfMonth(d = new Date()) { const x = new Date(d.getFullYear(), d.getMonth(), 1); x.setHours(0,0,0,0); return x; }
    function startOfCalendarYear(d = new Date()) { const x = new Date(d.getFullYear(), 0, 1); x.setHours(0,0,0,0); return x; }
    function startOfFiscalYear(d = new Date()) {
      const fyStartMonth = 9; // October (0-based)
      const today = new Date(d);
      const year = today.getMonth() >= fyStartMonth ? today.getFullYear() : today.getFullYear() - 1;
      const x = new Date(year, fyStartMonth, 1); x.setHours(0,0,0,0); return x;
    }

    function summarizePeriod(rows, periodStart, periodEnd) {
      const S = { commits: 0, files: {json:0, csv:0, both:0}, added:0, removed:0, ransom:0, admin:0 };
      for (const r of rows) {
        const t = new Date(r.time);
        if (t >= periodStart && t <= periodEnd) {
          S.commits++;
          if (r.flags.json && r.flags.csv) S.files.both++;
          else if (r.flags.json) S.files.json++;
          else if (r.flags.csv) S.files.csv++;

          for (const arr of r.changes.values()) for (const ch of arr) {
            if (ch.type === "added") S.added++;
            else if (ch.type === "removed") S.removed++;
            else if (ch.type === "ransom") S.ransom++;
            else if (ch.type === "admin") S.admin++;
          }
        }
      }
      return S;
    }

    function cardHTML(title, S) {
      return `<div class="card">
        <h3>${title}</h3>
        <div class="nums">
          <div class="num"><strong>${S.commits}</strong>Commits</div>
          <div class="num"><strong>${S.files.json}</strong>JSON</div>
          <div class="num"><strong>${S.files.csv}</strong>CSV</div>
          <div class="num"><strong>${S.files.both}</strong>Both</div>
        </div>
        <div class="nums" style="margin-top:8px">
          <div class="num"><strong style="color:var(--added)">${S.added}</strong>Added</div>
          <div class="num"><strong style="color:var(--removed)">${S.removed}</strong>Removed</div>
          <div class="num"><strong style="color:var(--ransom)">${S.ransom}</strong>Ransom</div>
          <div class="num"><strong style="color:var(--admin)">${S.admin}</strong>Admin</div>
        </div>
      </div>`;
    }
    function renderDashboard(rows) {
      const now = new Date();
      const todayStart = startOfToday(now);
      const weekStart  = startOfWeek(now);     // last 7 days rolling
      const monthStart = startOfMonth(now);
      const cyStart    = startOfCalendarYear(now);
      const fyStart    = startOfFiscalYear(now);
      const end        = now;

      const S_today = summarizePeriod(rows, todayStart, end);
      const S_week  = summarizePeriod(rows, weekStart, end);
      const S_month = summarizePeriod(rows, monthStart, end);
      const S_cy    = summarizePeriod(rows, cyStart, end);
      const S_fy    = summarizePeriod(rows, fyStart, end);

      const dash = document.getElementById("dashboard");
      dash.innerHTML = [
        cardHTML("Today", S_today),
        cardHTML("Last 7 Days", S_week),
        cardHTML("This Month", S_month),
        cardHTML("Calendar YTD", S_cy),
        cardHTML("Fiscal YTD", S_fy),
      ].join("");

      document.getElementById("dash-updated").textContent = "Last updated: " + fmt(new Date());
    }

    /* ===== Unified Loader (14‑day table + dashboard) ===== */
    const rawCache = new Map(); // key: `${sha}:${path}` -> file text

    async function cachedRawAt(sha, path) {
      const key = `${sha}:${path}`;
      if (rawCache.has(key)) return rawCache.get(key);
      const text = await rawAt(sha, path);
      rawCache.set(key, text);
      return text;
    }

    function findPrevSha(history, sha) {
      const idx = history.findIndex(c => c.sha === sha);
      const prev = idx >= 0 ? history[idx+1] : null;
      return prev ? prev.sha : null;
    }

    function mergeChangeMaps(baseMap, newMap) {
      const merged = new Map(baseMap);
      for (const [id, list] of newMap.entries()) {
        if (!merged.has(id)) merged.set(id, list);
        else merged.set(id, merged.get(id).concat(list));
      }
      return merged;
    }

    async function loadUnified() {
      const tbody = document.getElementById("timeline");
      const updated = document.getElementById("updated");
      try {
        // 1) List histories for each file (avoid per‑commit detail calls)
        const [jsonHist, csvHist] = await Promise.all([
          listHistoryForPath(PATHS.JSON, 120),
          listHistoryForPath(PATHS.CSV, 120)
        ]);

        // 2) Build a unified commit set with flags
        const bySha = new Map(); // sha -> { sha, time, flags:{json,csv} }
        const addCommit = (c, isJson) => {
          const sha = c.sha;
          const time = c.commit?.author?.date || c.commit?.committer?.date;
          if (!bySha.has(sha)) bySha.set(sha, { sha, time, flags: { json: false, csv: false } });
          bySha.get(sha).flags[isJson ? "json" : "csv"] = true;
        };
        jsonHist.forEach(c => addCommit(c, true));
        csvHist.forEach(c => addCommit(c, false));

        // 3) Sort newest first, then filter to last 14 days
        const commits = Array.from(bySha.values()).sort((a,b)=> new Date(b.time) - new Date(a.time));
        const cutoff = Date.now() - 14*24*60*60*1000;
        const recentRows = commits.filter(c => new Date(c.time).getTime() >= cutoff);

        // 4) For each recent commit, compute diffs for touched files (using cached raw fetches)
        const rows = [];
        for (const item of recentRows) {
          let combined = new Map();

          if (item.flags.json) {
            const currText = await cachedRawAt(item.sha, PATHS.JSON);
            const prevSha  = findPrevSha(jsonHist, item.sha);
            const prevText = prevSha ? await cachedRawAt(prevSha, PATHS.JSON) : null;

            const currMap = parseKEVJson(currText);
            const prevMap = prevText ? parseKEVJson(prevText) : new Map();

            const diffMap = diffRecords(currMap, prevMap, true);
            combined = mergeChangeMaps(combined, diffMap);
          }
          if (item.flags.csv) {
            const currText = await cachedRawAt(item.sha, PATHS.CSV);
            const prevSha  = findPrevSha(csvHist, item.sha);
            const prevText = prevSha ? await cachedRawAt(prevSha, PATHS.CSV) : null;

            const currMap = parseCsv(currText);
            const prevMap = prevText ? parseCsv(prevText) : new Map();

            const diffMap = diffRecords(currMap, prevMap, false);
            combined = mergeChangeMaps(combined, diffMap);
          }

          rows.push({ time: item.time, flags: item.flags, changes: combined });
        }

        // 5) Render dashboard (over entire unified set) + 14‑day table
        renderDashboard(rows);
        const tableRows = rows.map(r => renderRow(r.time, r.flags, r.changes));
        tbody.innerHTML = tableRows.join("") || `<tr><td colspan="4">No JSON/CSV updates in the last 14 days.</td></tr>`;
        updated.textContent = "Last updated: " + fmt(new Date());
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="4">Error loading updates: ${e.message}</td></tr>`;
      }
    }

    // Initial load
    loadUnified();
  </script>
</body>
</html>
